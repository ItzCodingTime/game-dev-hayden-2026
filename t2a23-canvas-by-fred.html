<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Shapes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }

    canvas {
      border: 1px solid black;
    }
  </style>
</head>

<body>
  <h2>t2a23-canvas-by-fred.html</h2>

  <p>Click the button to draw basic shapes.</p>

  <button type="button" id="drawShapes">
    Draw Basic Shapes
  </button>

  <br><br>

  <canvas
    id="myCoolTag"
    width="500"
    height="300"
    aria-label="A canvas showing geometric shapes and text"
  ></canvas>

  <script>
    const canvas = document.getElementById('myCoolTag');
    const context = canvas.getContext('2d');

    function drawShapes() {
      // Clear the canvas before drawing again.
      context.clearRect(0, 0, canvas.width, canvas.height);

      // Draw a line.
      context.beginPath();
      context.lineWidth = 3;
      context.strokeStyle = 'black';
      context.moveTo(20, 20);
      context.lineTo(150, 20);
      context.stroke();

      // Draw a solid rectangle.
      context.fillStyle = 'blue';
      context.fillRect(30, 50, 100, 60);

      // Draw a circle.
      context.beginPath();
      context.lineWidth = 5;
      context.strokeStyle = 'green';
      context.arc(220, 80, 40, 0, 2 * Math.PI);
      context.stroke();

      // Write text.
      context.fillStyle = 'red';
      context.font = '24px Arial';
      context.fillText('Hello World!', 30, 180);
    }

    document
      .getElementById('drawShapes')
      .addEventListener('click', drawShapes);
  </script>
</body>
</html>
