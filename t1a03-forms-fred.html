<h1 align="center">t1a03-forms-fred.html</h1>
<h3><font color="green">Proving you can use: Forms 2023</font></h3>

<form action="#" method="post">
  <label for="firstName">First Name:</label>
  <input type="text" id="firstName" name="firstName" value="Fred"><br>

  <label>Checkbox:</label><br>
  <label><input type="checkbox" name="beef" value="beef"> Beef</label><br>
  <label><input type="checkbox" name="veggie" value="veggie"> Veggy</label><br>

  <label>Radio Buttons:</label><br>
  <label><input type="radio" name="myRad01" value="95.4"> 95.4</label><br>
  <label><input type="radio" name="myRad01" value="101"> 101</label><br>

  <label>Hidden:</label>
  <input type="hidden" name="secret" value="demo"><br>

  <label>File:</label>
  <input type="file" name="uploadFile"><br>

  <input type="reset" value="Reset"><br>
  <input type="submit" value="Submit (advanced)"><br>

  <label>Button:</label>
  <input type="button" value="Click" onclick="document.getElementById('myArea01').value = 'Cool';"><br>

  <label for="myArea01">Textarea:</label><br>
  <textarea id="myArea01" name="notes" cols="60" rows="5">Cool this works</textarea><br>

  <label for="mySelect01">Select Box:</label><br>
  <select id="mySelect01" name="pet" size="2" onchange="document.getElementById('myArea01').value = this.value;">
    <option value="Dog">Dog</option>
    <option value="Cat">Cat</option>
    <option value="Mouse">Mouse</option>
  </select>
</form>
