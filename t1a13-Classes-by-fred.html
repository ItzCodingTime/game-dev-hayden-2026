<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Classes Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f7f7f7;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      margin: 20px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
    }

    input {
      padding: 8px;
      font-size: 1rem;
    }

    button {
      padding: 10px 16px;
      font-size: 1rem;
      cursor: pointer;
    }

    #myDiv {
      min-height: 60px;
      margin-top: 20px;
      padding: 12px;
      background: #eef6ff;
      border-radius: 8px;
      border: 1px solid #cfe0ff;
    }
  </style>
</head>
<body>
  <main>
    <h2>JavaScript Classes Demo</h2>

    <p>
      <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Classes" target="_blank" rel="noopener">
        Find a good reference for JavaScript classes
      </a>
    </p>

    <p>
      Classes are blueprints for objects. They store data (properties) and behavior (methods).
    </p>

    <h4>Example: JavaScript class</h4>

    <form id="animalForm">
      <div>
        <label for="myText01">Name:</label>
        <input type="text" id="myText01" value="Snickers">
      </div>

      <div>
        <label for="myAge">Age:</label>
        <input type="number" id="myAge" value="5" min="0">
      </div>

      <button type="submit" id="exampleButton">Show Animal Class Example</button>
    </form>

    <div id="myDiv" aria-live="polite">...</div>
  </main>

  <script>
    class Animal {
      constructor(name, age) {
        this.name = name;
        this.age = age;
      }

      describe() {
        return `Hello ${this.name}. You are ${this.age} years old.`;
      }

      show() {
        const output = document.getElementById('myDiv');
        output.textContent = this.describe();
      }
    }

    document.getElementById('animalForm').addEventListener('submit', (event) => {
      event.preventDefault();

      const name = document.getElementById('myText01').value.trim() || 'Unknown';
      const age = Number(document.getElementById('myAge').value) || 0;

      const myDog = new Animal(name, age);
      myDog.show();
    });
  </script>
</body>
</html>
