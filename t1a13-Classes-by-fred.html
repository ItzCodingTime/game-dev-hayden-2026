<p>
  Classes are objects that store data (called properties) and functions that work with that data
  (called methods).
</p>

<h4>Example: JavaScript class</h4>

Name: <input type="text" id="myText01" value="Useless at the moment"><br>
<input type="button" id="exampleButton" value="Show Animal Class Example">

<div id="myDiv">...</div>

<script>
  class Animal {
    constructor(passName, passAge) {
      this.myName = passName;
      this.myAge = passAge;
    }

    myShow() {
      document.getElementById('myDiv').innerHTML =
        `Hello ${this.myName}. You are ${this.myAge} years old.<br>`;
    }
  }

  document.getElementById('exampleButton').addEventListener('click', () => {
    const myDog = new Animal('Snickers', 5);
    myDog.myShow();
  });
</script>
