<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>t1a06-proper-and-variables-fred.html</title>
  <style>
    b { color: blue; }
  </style>
  <script>
    function sayHello() {
      const myNum = 3;
      const myString = 'Hello';
      const myFloat = 17.5;
      const myBool = true;
      const myOut = document.getElementById('myDiv01');

      if (!myOut) {
        return;
      }

      myOut.innerHTML = myNum + myString + myFloat + ', ' + myBool;

      if (myBool) {
        myOut.innerHTML += ', WOW';
      }
    }
  </script>
</head>
<body>
  <p>This is <b>bold</b> text.</p>
  <button onclick="sayHello()">Click Me</button>
  <div id="myDiv01">...</div>
</body>
</html>
