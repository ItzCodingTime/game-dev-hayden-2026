<h4>Example: displaying array items</h4>

<label for="myText01">Show first N names:</label>
<input type="number" id="myText01" value="3" min="0" max="5" step="1"><br><br>

<button id="showArrayBtn" type="button">Show Names</button>
<button id="showNumberBtn" type="button">Show Number Array</button>
<button id="clearBtn" type="button">Clear</button>

<div id="myDiv01" aria-live="polite">...</div>

<script>
  const nameArray = ['Fred', 'Mary', 'Lizzy', 'Sam', 'Ava'];
  const numberArray = [10, 25, 30, 40, 50];

  const outputEl = document.getElementById('myDiv01');
  const inputEl = document.getElementById('myText01');

  function updateOutput(message) {
    outputEl.innerHTML = message;
  }

  function showArrayExample() {
    const maxEntries = Number.parseInt(inputEl.value, 10);

    if (!Number.isInteger(maxEntries) || maxEntries < 0) {
      updateOutput('Please enter a valid whole number from 0 to ' + nameArray.length + '.');
      return;
    }

    const safeMax = Math.min(maxEntries, nameArray.length);

    let output = '<strong>Names in the array:</strong><br>';

    for (let i = 0; i < safeMax; i++) {
      output += `Loop #${i} | array entry: ${nameArray[i]}<br>`;
    }

    updateOutput(output);
  }

  function showNumberArrayExample() {
    let total = 0;
    let output = '<strong>Number array example:</strong><br>';

    for (let i = 0; i < numberArray.length; i++) {
      total += numberArray[i];
      output += `Value ${i}: ${numberArray[i]}<br>`;
    }

    const average = total / numberArray.length;

    output += `<br><strong>Total:</strong> ${total}`;
    output += `<br><strong>Average:</strong> ${average.toFixed(2)}`;

    updateOutput(output);
  }

  document.getElementById('showArrayBtn').addEventListener('click', showArrayExample);
  document.getElementById('showNumberBtn').addEventListener('click', showNumberArrayExample);
  document.getElementById('clearBtn').addEventListener('click', () => {
    updateOutput('...');
  });
</script>
