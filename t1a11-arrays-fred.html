<h4>Example working array code</h4>

Max Array Entry:
<input type="number" id="myText01" value="3" min="0" max="10"><br>

<input type="button" value="Example" onclick="showArrayExample()">

<div id="myDiv01">...</div>

<br>

You can make more arrays that do different things, including arrays of numbers.<br>

<script>
  function showArrayExample() {
    let myTemp = Number(document.getElementById('myText01').value);
    let mySum = '';
    let myArray = ['Fred', 'Mary', 'Lizzy'];

    document.getElementById('myDiv01').innerHTML = '';

    for (let myLoop = 0; myLoop < myTemp && myLoop < myArray.length; myLoop++) {
      mySum += 'Loop #: ' + myLoop + ' array entry: ' + myArray[myLoop] + '<br>';
    }

    document.getElementById('myDiv01').innerHTML = mySum;
  }
</script>
