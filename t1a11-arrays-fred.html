<h4>Example: displaying array items</h4>

<label for="myText01">Max Array Entry:</label>
<input type="number" id="myText01" value="3" min="0" max="10"><br><br>

<button id="showArrayBtn">Show Names</button>
<button id="showNumberBtn">Show Number Array</button>

<div id="myDiv01">...</div>

<script>
  const nameArray = ['Fred', 'Mary', 'Lizzy', 'Sam', 'Ava'];

  document.getElementById('showArrayBtn').addEventListener('click', showArrayExample);
  document.getElementById('showNumberBtn').addEventListener('click', showNumberArrayExample);

  function showArrayExample() {
    const maxEntries = Number(document.getElementById('myText01').value);

    if (isNaN(maxEntries) || maxEntries < 0) {
      document.getElementById('myDiv01').innerHTML = 'Please enter a valid number.';
      return;
    }

    const safeMax = Math.min(maxEntries, nameArray.length);

    let output = '<strong>Names in the array:</strong><br>';
    for (let i = 0; i < safeMax; i++) {
      output += 'Loop #: ' + i + ' | array entry: ' + nameArray[i] + '<br>';
    }

    document.getElementById('myDiv01').innerHTML = output;
  }

  function showNumberArrayExample() {
    const numberArray = [10, 25, 30, 40, 50];
    let total = 0;
    let output = '<strong>Number array example:</strong><br>';

    for (let i = 0; i < numberArray.length; i++) {
      total += numberArray[i];
      output += 'Value ' + i + ': ' + numberArray[i] + '<br>';
    }

    output += '<br><strong>Total:</strong> ' + total;
    output += '<br><strong>Average:</strong> ' + (total / numberArray.length);

    document.getElementById('myDiv01').innerHTML = output;
  }
</script>
