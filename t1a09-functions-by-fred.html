<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Functions by Fred</title>
  <script>
    function myExampleFunction() {
      const input = document.getElementById('myText01');
      const number = Number.parseInt(input.value, 10);

      if (Number.isNaN(number)) {
        return 'Please enter a valid number.';
      }

      const sum = number + number;
      return `${number} + ${number} = ${sum}`;
    }

    function updateResult() {
      const output = document.getElementById('myDiv01');
      output.textContent = myExampleFunction();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('calcButton').addEventListener('click', updateResult);
    });
  </script>
</head>
<body>
  <h2 align="center">t1a09-functions-by-Fred.html</h2>

  <p>
    <a href="https://www.w3schools.com/js/js_functions.asp">
      Good reference to JavaScript functions
    </a>
  </p>

  <p>
    Functions are used to organize code sensibly. They can then be called elsewhere.
    Information can also be passed to functions (that is more advanced).
  </p>

  <h4>Example working code</h4>

  <label for="myText01">Enter a number:</label>
  <input type="text" id="myText01" value="3"><br><br>

  <button id="calcButton" type="button">Function Example</button>

  <div id="myDiv01">...</div>
</body>
</html>
