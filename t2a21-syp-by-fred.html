<h1 align="center">Simple Text Encryptor</h1>

<textarea id="myArea01" rows="4" cols="70">Hello how are you</textarea>

<input
  type="button"
  value="Encrypt"
  onclick="encryptText()"
>
<br><br>

<textarea id="myArea02" rows="4" cols="70" readonly></textarea>

<input
  type="button"
  value="Decrypt"
  onclick="decryptText()"
>
<br><br>

<textarea
  id="myArea03"
  rows="4"
  cols="70"
  readonly
></textarea>

<script>
function encryptText() {
  const text = document.getElementById("myArea01").value.toLowerCase()

  const encrypted = text
    .split("")
    .map(character => {
      if (character === "e") return "f"
      if (character === "h") return "i"
      return character
    })
    .join("")

  document.getElementById("myArea02").value = encrypted
  document.getElementById("myArea03").value = ""
}

function decryptText() {
  const text = document.getElementById("myArea02").value.toLowerCase()

  const decrypted = text
    .split("")
    .map(character => {
      if (character === "f") return "e"
      if (character === "i") return "h"
      return character
    })
    .join("")

  document.getElementById("myArea03").value = decrypted
}
</script>
