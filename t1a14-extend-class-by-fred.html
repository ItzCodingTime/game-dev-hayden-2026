<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class Inheritance Example</title>
  <script>
    class MyAnimal {
      constructor(name, age) {
        this.name = name;
        this.age = age;
      }

      show() {
        document.getElementById('myDiv01').innerHTML =
          'Hello ' + this.name + '<br>';
      }
    }

    class MyCat extends MyAnimal {
      constructor(name, age) {
        super(name, age);
      }

      show() {
        document.getElementById('myDiv01').innerHTML =
          this.name + ' is a great cat<br>' +
          'Age: ' + this.age + '<br>';
      }
    }

    function showDog() {
      const myDog = new MyAnimal('Snickers', 5);
      myDog.show();
    }

    function showCat() {
      const myPet = new MyCat('Fluffy', 14);
      myPet.show();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('dogButton').addEventListener('click', showDog);
      document.getElementById('catButton').addEventListener('click', showCat);
    });
  </script>
</head>
<body>
  <h2 align="center">t1a14-extend-class-by-fred.html</h2>
  <p>Extending a pre-existing Class</p>

  <h4>Example working classes code</h4>
  <button id="dogButton">Example Class Set and Show Class Animal</button>

  <h4>Example extending class code</h4>
  <label for="myText01">Nothing:</label>
  <input type="text" id="myText01" value="Useless at the moment"><br><br>

  <button id="catButton">Example Extend Class Animal</button>

  <div id="myDiv01">...</div>
</body>
</html>
